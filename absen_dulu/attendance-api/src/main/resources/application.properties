spring.application.name=attendance-api

# Koneksi Database MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/absen_dulu?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Konfigurasi JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false



# Pengaturan Port (Default 8080)
server.port=8080
server.address=0.0.0.0
